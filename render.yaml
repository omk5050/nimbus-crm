# Render Blueprint — Single-Link Deployment Configuration for Nimbus CRM
# Deploys both Frontend static SPA and Backend REST API under a single URL!

services:
  - type: web
    name: nimbus-crm
    env: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm --prefix backend run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString

databases:
  - name: nimbus-db
    plan: free
    databaseName: nimbus_crm
    user: nimbus_user
